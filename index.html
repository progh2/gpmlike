<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuri Term / 누리학기 — day sim MVP</title>
  </head>
  <body>
    <div id="hud">
      <strong>Nuri Term</strong> · 일과 MVP · Hub Talk/Drill/Desk/Bay/Shop
      <label class="slot-picker">
        <span>Avatar slot</span>
        <select id="slot-select"></select>
      </label>
      <p id="slot-meta"></p>
      <p id="slot-status">카탈로그 로드 중…</p>
      <p id="clock-status">학원 시계 대기…</p>
      <ul id="npc-roster"></ul>
    </div>
    <aside id="day-hud" aria-label="일과 HUD">
      <header class="day-hud-head">
        <strong>DayHUD</strong>
        <span id="day-date">일과 · MORNING</span>
      </header>
      <ol id="day-beats"></ol>
      <section class="day-panel" aria-label="발언">
        <h2>Voice / 발언</h2>
        <div id="day-stats"></div>
      </section>
      <section class="day-panel" aria-label="신뢰">
        <h2>Trust / 신뢰 [A→B]</h2>
        <ul id="day-relations"></ul>
      </section>
      <p id="day-note"></p>
      <div id="day-choices"></div>
      <div class="day-actions">
        <button type="button" id="day-advance">다음 비트</button>
        <button type="button" id="day-reset">새 학기</button>
      </div>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
